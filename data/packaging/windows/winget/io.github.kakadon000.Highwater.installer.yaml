# Winget manifest submission template for Highwater (todo 21 — manifest only;
# submission to microsoft/winget-pkgs is the user's call). To submit, copy the
# three files under manifests/i/io.github.kakadon000/Highwater/<version>/ into a
# fork of microsoft/winget-pkgs, point InstallerUrl at the released
# Highwater-v<version>-setup.exe asset, and open a PR against
# microsoft/winget-pkgs.
PackageIdentifier: io.github.kakadon000.Highwater
PackageVersion: 0.9.1
Installers:
  - InstallerLocale: en-US
    Architecture: x64
    InstallerType: inno
    InstallerUrl: https://github.com/kakadon000/highwater/releases/download/v0.9.1/Highwater-v0.9.1-setup.exe
    InstallerSha256: <sha256 of the released setup executable, filled at release time>
    Scope: user
    InstallerSwitches:
      Silent: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
      SilentWithProgress: /SILENT /SUPPRESSMSGBOXES /NORESTART
    UpgradeBehavior: install
ManifestType: installer
ManifestVersion: 1.9.0
